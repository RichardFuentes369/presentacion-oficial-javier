<div class="app-wrapper">
  <!-- Banner Superior -->
  <header class="top-banner-wrapper">
    <app-globales-banner></app-globales-banner>
  </header>

  <div class="app-body">
    <!-- Sidebar con evento de encogimiento -->
    <aside class="app-sidebar" [class.collapsed]="isSidebarCollapsed">
      <app-globales-navbar (sidebarCollapsed)="isSidebarCollapsed = $event"></app-globales-navbar>
    </aside>

    <!-- Área de contenido principal -->
    <main class="app-main-content">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>

      <!-- Footer ahora integrado ordenadamente dentro del panel de contenido -->
      <footer class="app-footer-integrated">
        <app-globales-footer></app-globales-footer>
      </footer>
    </main>
  </div>
</div>
