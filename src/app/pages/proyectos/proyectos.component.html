<div class="projects-container">
  <div class="main-projects-card">
    
    <!-- Encabezado de la Sección -->
    <div class="projects-header">
      <span class="section-tag">Portafolio</span>
      <h3>Proyectos Destacados & Software Desarrollado</h3>
      <p>Aplicaciones web y móviles construidas con buenas prácticas y arquitecturas escalables</p>
    </div>

    <!-- Grilla de Proyectos -->
    <div *ngFor="let grupo of Proyectos">
      <div class="projects-grid">
        <div class="project-card" *ngFor="let proyecto of grupo.proyectos">
          
          <div class="card-content">
            <!-- Encabezado de la Tarjeta -->
            <div class="card-top">
              <span class="app-type">
                <i class="fas fa-globe text-primary"></i> {{proyecto.typeApp}}
              </span>
              <span class="status-badge" [ngClass]="proyecto.status.toLowerCase()">
                <span class="status-dot"></span>
                {{proyecto.status}}
              </span>
            </div>

            <!-- Título y Descripción -->
            <h4 class="project-title">{{proyecto.name}}</h4>
            <p class="project-description">{{proyecto.descripction}}</p>
          </div>

          <!-- Pie de Tarjeta (Stack Tecnológico + Repositorio) -->
          <div class="card-footer-custom">
            <div class="tech-stack">
              <i *ngFor="let lenguaje of proyecto.lenguajes" 
                 [class]="lenguaje.icon + ' tech-icon'" 
                 [title]="lenguaje.name">
              </i>
            </div>
            
            <a class="repo-btn" [href]="proyecto.repositorio" target="_blank" title="Ver código fuente">
              <i class="fab fa-github"></i>
              <span>Código</span>
            </a>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
