<div class="skills-container">
  <div class="main-skills-card">
    
    <!-- Encabezado de la vista -->
    <div class="skills-header">
      <span class="section-tag">Stack Tecnológico</span>
      <h3>Tecnologías, Herramientas & Frameworks</h3>
      <p>Ecosistema de herramientas que utilizo para el desarrollo de software escalable</p>
    </div>

    <!-- Grilla principal de categorías -->
    <div class="skills-main-grid">
      <div class="skill-category-card" *ngFor="let item of Lenguajes">
        <div class="category-header">
          <div class="category-title">
            <span class="category-dot"></span>
            <h4>{{item.name}}</h4>
          </div>
          <span class="count-badge">{{item.lenguajes.length}} grupos</span>
        </div>

        <div class="subgroups-list">
          <div class="subgroup-item" *ngFor="let lengua of item.lenguajes">
            <h5 class="subgroup-name">{{lengua.name}}</h5>
            
            <div class="frameworks-chips">
              <div class="chip-item" *ngFor="let frame of lengua.frameworks">
                <i *ngIf="frame.icon" [class]="frame.icon + ' chip-icon'"></i>
                <span>{{frame.name}}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
